[project]
name = "industrial-mcp"
version = "0.1.0"
description = "MCP server giving Claude read access to industrial sensor data and safety-gated control over motors"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Brayan Castro", email = "info@ingebc.com" }
]
keywords = ["mcp", "claude", "anthropic", "industrial", "iot", "physical-ai", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
mqtt = ["paho-mqtt>=2.0.0"]
rest = ["httpx>=0.27.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[project.scripts]
industrial-mcp = "industrial_mcp.server:main"

[project.urls]
Homepage = "https://github.com/brayangcastro/mcp-industrial-agent"
Issues = "https://github.com/brayangcastro/mcp-industrial-agent/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/industrial_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
